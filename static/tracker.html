<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Drug / Stock Stage Tracker</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:     #0d1117; --card:   #161b22; --card2:  #1c2128;
      --border: #30363d; --text:   #e6edf3; --dim:    #8b949e;
      --green:  #3fb950; --red:    #f85149; --blue:   #58a6ff;
      --yellow: #d29922; --orange: #db6d28; --purple: #bc8cff; --teal: #39d353;
    }
    html, body { height: 100%; font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); }
    body { display: flex; flex-direction: column; overflow: hidden; }

    /* ── app header ─────────────────────────────────────────────────── */
    header {
      display: flex; align-items: center; gap: 12px; padding: 10px 20px;
      background: var(--card); border-bottom: 1px solid var(--border); flex-shrink: 0;
    }
    header h1 { font-size: 1rem; font-weight: 600; }
    header .sub { color: var(--dim); font-size: .8rem; margin-left: auto; }

    /* ── layout ─────────────────────────────────────────────────────── */
    .layout { display: flex; flex: 1; overflow: hidden; }

    /* ── sidebar ────────────────────────────────────────────────────── */
    .sidebar {
      width: 250px; flex-shrink: 0;
      background: var(--card); border-right: 1px solid var(--border);
      display: flex; flex-direction: column; overflow: hidden;
    }
    .sb-top { padding: 12px; border-bottom: 1px solid var(--border); display: flex; gap: 8px; }
    .sb-top input {
      flex: 1; background: var(--bg); border: 1px solid var(--border);
      color: var(--text); border-radius: 6px; padding: 6px 10px; font-size: .85rem; outline: none;
    }
    .sb-top input:focus { border-color: var(--blue); }
    .sb-top .btn-add {
      background: var(--blue); color: #000; border: none; border-radius: 6px;
      padding: 6px 12px; font-size: .85rem; font-weight: 700; cursor: pointer;
    }
    .sb-top .btn-add:hover { opacity: .85; }
    .filter-bar { padding: 8px 12px; border-bottom: 1px solid var(--border); display: flex; gap: 5px; flex-wrap: wrap; }
    .fbtn {
      font-size: .7rem; padding: 3px 8px; border-radius: 4px; cursor: pointer;
      background: var(--card2); color: var(--dim); border: 1px solid var(--border); transition: all .15s;
    }
    .fbtn.active { color: var(--text); border-color: var(--blue); background: #1a2636; }
    .stock-list { overflow-y: auto; flex: 1; }
    .s-item {
      padding: 9px 12px; border-bottom: 1px solid var(--border); cursor: pointer;
      display: flex; align-items: center; gap: 7px; transition: background .1s;
    }
    .s-item:hover { background: var(--card2); }
    .s-item.active { background: #1a2636; border-left: 3px solid var(--blue); padding-left: 9px; }
    .s-ticker { font-weight: 700; font-size: .9rem; min-width: 50px; }
    .s-pill { font-size: .66rem; padding: 2px 7px; border-radius: 10px; font-weight: 600; white-space: nowrap; }
    .s-chk { margin-left: auto; font-size: .7rem; color: var(--dim); }
    .s-del { background: none; border: none; color: var(--dim); cursor: pointer; font-size: .76rem; opacity: 0; padding: 2px 4px; }
    .s-item:hover .s-del { opacity: 1; }

    /* ── main panel ─────────────────────────────────────────────────── */
    .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .empty-state { flex: 1; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 8px; color: var(--dim); }
    .empty-state .ei { font-size: 2.5rem; }
    .detail { flex: 1; overflow-y: auto; padding: 16px 20px; display: flex; flex-direction: column; gap: 12px; }

    /* ── top identity card ──────────────────────────────────────────── */
    .id-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 10px;
      padding: 14px 16px; display: flex; flex-direction: column; gap: 10px;
    }
    .id-row1 { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .id-ticker { font-size: 1.9rem; font-weight: 800; letter-spacing: -.5px; }
    .id-name {
      flex: 1; background: transparent; border: none; border-bottom: 1px dashed var(--border);
      color: var(--dim); font-size: .92rem; outline: none; min-width: 160px; padding: 2px 4px;
    }
    .id-name:focus { border-bottom-color: var(--blue); color: var(--text); }
    .id-stage-pill { font-size: .8rem; padding: 5px 14px; border-radius: 20px; font-weight: 700; cursor: pointer; border: 2px solid transparent; }

    /* tags */
    .tags-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; min-height: 26px; }
    .tag-pill {
      font-size: .72rem; font-weight: 700; padding: 3px 10px; border-radius: 20px;
      cursor: pointer; border: 1px solid; letter-spacing: .2px; transition: opacity .15s;
    }
    .tag-pill:hover { opacity: .75; }
    .btn-addtag {
      font-size: .72rem; padding: 3px 10px; border-radius: 20px; cursor: pointer;
      background: var(--card2); border: 1px dashed var(--border); color: var(--dim); font-weight: 600;
    }
    .btn-addtag:hover { border-color: var(--blue); color: var(--blue); }
    .tag-picker {
      background: var(--card2); border: 1px solid var(--border); border-radius: 8px;
      padding: 10px; display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px;
    }
    .tp-option { font-size: .72rem; font-weight: 700; padding: 3px 10px; border-radius: 20px; cursor: pointer; border: 1px solid; opacity: .45; transition: opacity .15s; }
    .tp-option.on { opacity: 1; }
    .tp-option:hover { opacity: .8; }

    /* catalyst banner */
    .cat-banner {
      background: #0f1f0f; border: 1px solid #2a4a1a; border-radius: 8px;
      padding: 10px 14px; display: flex; align-items: center; gap: 10px;
    }
    .cat-lbl { font-size: .65rem; font-weight: 800; color: var(--teal); text-transform: uppercase; letter-spacing: .8px; white-space: nowrap; }
    .cat-sep { color: var(--border); font-size: 1rem; }
    .cat-input {
      flex: 1; background: transparent; border: none; color: #c8f0a0; font-size: .88rem;
      font-weight: 500; outline: none; font-family: inherit;
    }
    .cat-input::placeholder { color: #3a5a2a; }

    /* ── 2-column sections grid ─────────────────────────────────────── */
    .sec-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .sec-full { grid-column: 1 / -1; }

    /* individual section card */
    .sec-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 10px;
      display: flex; flex-direction: column; min-height: 120px; overflow: hidden;
    }
    .sec-hdr {
      display: flex; align-items: center; gap: 7px; padding: 8px 12px;
      border-bottom: 1px solid var(--border); flex-shrink: 0;
    }
    .sec-ico { font-size: .85rem; }
    .sec-lbl { font-size: .7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .6px; color: var(--dim); flex: 1; }
    .sec-edit-btn {
      font-size: .68rem; padding: 2px 7px; border-radius: 4px; cursor: pointer;
      background: none; border: 1px solid var(--border); color: var(--dim);
    }
    .sec-edit-btn:hover { border-color: var(--blue); color: var(--blue); }
    .sec-edit-btn.active { background: #1a2636; border-color: var(--blue); color: var(--blue); }

    /* view mode */
    .sec-view {
      flex: 1; padding: 10px 12px; font-family: 'Cascadia Code', 'Consolas', monospace;
      font-size: .76rem; line-height: 1.75; white-space: pre-wrap; word-break: break-word;
      color: var(--text); cursor: text; overflow-y: auto;
    }
    .sec-view.empty { color: #3a4a3a; font-style: italic; font-family: 'Segoe UI', sans-serif; font-size: .8rem; }

    /* edit mode */
    .sec-textarea {
      flex: 1; background: #111820; border: none; border-top: 1px solid var(--border);
      color: var(--text); padding: 10px 12px;
      font-family: 'Cascadia Code', 'Consolas', monospace;
      font-size: .76rem; line-height: 1.75; resize: none; outline: none; min-height: 120px;
    }
    .sec-textarea:focus { background: #0f1520; }
    .sec-save-row { padding: 5px 10px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .sec-save-meta { font-size: .68rem; color: var(--dim); }
    .sec-done-btn { font-size: .68rem; padding: 2px 8px; border-radius: 4px; cursor: pointer; background: var(--blue); color: #000; border: none; font-weight: 700; }

    /* ── collapsible card (stage, checklist) ────────────────────────── */
    .coll-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
    .coll-hdr {
      display: flex; align-items: center; gap: 8px; padding: 10px 14px;
      cursor: pointer; user-select: none;
    }
    .coll-hdr:hover { background: var(--card2); }
    .coll-ico { font-size: .9rem; }
    .coll-ttl { font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .6px; color: var(--dim); flex: 1; }
    .coll-meta { font-size: .75rem; }
    .coll-arr { font-size: .65rem; color: var(--dim); transition: transform .2s; }
    .coll-arr.open { transform: rotate(90deg); }
    .coll-body { display: none; border-top: 1px solid var(--border); }
    .coll-body.open { display: block; }

    /* stage chips */
    .stage-grid { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 14px; }
    .stage-chip {
      padding: 5px 14px; border-radius: 20px; font-size: .78rem; font-weight: 600;
      cursor: pointer; border: 2px solid transparent; transition: all .15s; opacity: .45;
    }
    .stage-chip.selected { opacity: 1; }

    /* checklist */
    .chk-body { padding: 10px 14px; }
    .chk-toolbar { display: flex; gap: 6px; margin-bottom: 8px; }
    .chk-toolbar input {
      flex: 1; background: var(--card2); border: 1px solid var(--border); color: var(--text);
      border-radius: 6px; padding: 5px 9px; font-size: .8rem; outline: none;
    }
    .chk-toolbar input:focus { border-color: var(--blue); }
    .chk-toolbar button {
      background: var(--card2); border: 1px solid var(--border); color: var(--blue);
      border-radius: 6px; padding: 5px 10px; cursor: pointer; font-size: .8rem;
    }
    .chk-toolbar button:hover { background: var(--border); }
    .prog-wrap { background: var(--border); border-radius: 4px; height: 5px; overflow: hidden; margin-bottom: 8px; }
    .prog-fill { height: 100%; border-radius: 4px; background: var(--green); transition: width .3s; }
    .chk-grid { display: flex; flex-direction: column; gap: 5px; }
    .attr-row {
      display: flex; align-items: center; gap: 9px; background: var(--card2);
      border: 1px solid var(--border); border-radius: 7px; padding: 7px 10px; transition: border-color .15s;
    }
    .attr-row.checked { border-color: var(--green); }
    .attr-row input[type=checkbox] { width: 14px; height: 14px; cursor: pointer; accent-color: var(--green); flex-shrink: 0; }
    .attr-lbl { flex: 1; font-size: .8rem; }
    .attr-lbl.done { text-decoration: line-through; color: var(--dim); }
    .attr-del { background: none; border: none; color: var(--dim); cursor: pointer; font-size: .72rem; opacity: .3; }
    .attr-del:hover { opacity: 1; color: var(--red); }

    /* stage colors */
    .s-watchlist   { background:#1e1e26; color:var(--dim);    border-color:#3a3a50; }
    .s-preclinical { background:#1e2a3a; color:#7cbeff;       border-color:#2d4a6e; }
    .s-phase1      { background:#1e2a20; color:var(--teal);   border-color:#2d5e38; }
    .s-phase2      { background:#2a2a1e; color:var(--yellow); border-color:#5e5a2d; }
    .s-phase3      { background:#2a1e20; color:var(--orange); border-color:#6e3d2d; }
    .s-nda         { background:#2a1e2a; color:var(--purple); border-color:#5e2d6e; }
    .s-approved    { background:#1a2a1a; color:var(--green);  border-color:#2d5e2d; }
    .s-commercial  { background:#2a2010; color:#ffaa44;       border-color:#6e4a10; }

    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: var(--card); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  </style>
</head>
<body>

<header>
  <span style="font-size:1.2rem">💊</span>
  <h1>Drug / Stock Stage Tracker</h1>
  <span class="sub" id="totalCount">0 tracked</span>
</header>

<div class="layout">
  <!-- sidebar -->
  <div class="sidebar">
    <div class="sb-top">
      <input id="addInput" placeholder="Ticker or drug…" maxlength="20" />
      <button class="btn-add" onclick="addStock()">+ Add</button>
    </div>
    <div class="filter-bar" id="filterBar"></div>
    <div class="stock-list" id="stockList"></div>
  </div>

  <!-- main -->
  <div class="main" id="mainPanel">
    <div class="empty-state"><div class="ei">📋</div><div>Select or add a stock to begin</div></div>
  </div>
</div>

<script>
// ── constants ──────────────────────────────────────────────────────────────────
const STAGES = [
  { id:'watchlist',   label:'Watchlist',   cls:'s-watchlist'   },
  { id:'preclinical', label:'Pre-Clinical', cls:'s-preclinical' },
  { id:'phase1',      label:'Phase 1',      cls:'s-phase1'      },
  { id:'phase2',      label:'Phase 2',      cls:'s-phase2'      },
  { id:'phase3',      label:'Phase 3',      cls:'s-phase3'      },
  { id:'nda',         label:'NDA / BLA',    cls:'s-nda'         },
  { id:'approved',    label:'Approved',     cls:'s-approved'    },
  { id:'commercial',  label:'Commercial',   cls:'s-commercial'  },
];

const NOTE_SECS = [
  { key:'profile',   label:'Profile',            icon:'🏢', ph:'Company overview, lead drug, platform technology, indication…' },
  { key:'products',  label:'Products / Pipeline', icon:'💊', ph:'Approved products with revenue, pipeline drugs, trial status…' },
  { key:'catalysts', label:'Upcoming Catalysts',  icon:'🚀', ph:'[Q/Year] Event — detail\n[Q/Year] Event — detail' },
  { key:'thesis',    label:'Thesis',              icon:'🧠', ph:'Why this play, score, classification, strategy fit…' },
  { key:'risks',     label:'Risks',               icon:'⚠️',  ph:'- Risk 1\n- Risk 2' },
];

const ALL_TAGS = [
  { id:'solo_winner',   label:'⭐ Solo Winner',     color:'#ffd060', bg:'#2a250a', border:'#6a5a10' },
  { id:'platform_play', label:'🔬 Platform Play',   color:'#58a6ff', bg:'#0e1e36', border:'#1e4070' },
  { id:'fast_track',    label:'⚡ Fast Track',      color:'#bc8cff', bg:'#1e1030', border:'#4a2070' },
  { id:'near_approval', label:'🎯 Near Approval',   color:'#d29922', bg:'#2a2010', border:'#6a5010' },
  { id:'binary_event',  label:'🎲 Binary Event',    color:'#db6d28', bg:'#2a1a08', border:'#6a3810' },
  { id:'revenue_base',  label:'💰 Revenue Base',    color:'#ffaa44', bg:'#261a00', border:'#604010' },
  { id:'barda_funded',  label:'🏛 BARDA Funded',    color:'#39d353', bg:'#0a1e10', border:'#1a5028' },
  { id:'govt_backed',   label:'🏛 Govt Backed',     color:'#39d353', bg:'#0a1e10', border:'#1a5028' },
  { id:'derisked',      label:'🛡 De-risked',       color:'#3fb950', bg:'#0a1e10', border:'#1a4a1a' },
  { id:'orphan_drug',   label:'🏥 Orphan Drug',     color:'#7cbeff', bg:'#0a1830', border:'#1a3a60' },
  { id:'competitive',   label:'⚔️ Competitive Mkt', color:'#f85149', bg:'#2a0e0e', border:'#601010' },
  { id:'dilution_risk', label:'⚠️ Dilution Risk',   color:'#f85149', bg:'#2a0e0e', border:'#601010' },
];

const DEFAULT_ATTRS = [
  'Strong management team',
  'Large addressable market (TAM)',
  'Catalyst upcoming (PDUFA / trial readout)',
  'Clean balance sheet / cash runway',
  'No major competitors',
  'Orphan drug / fast-track designation',
  'Positive phase 2 data',
  'Institutional ownership',
];

const EMPTY_SECS = () => ({ profile:'', products:'', catalysts:'', thesis:'', risks:'' });

// ── state ──────────────────────────────────────────────────────────────────────
let stocks = [];
let selectedId = null;
let currentFilter = 'all';
let editMode = {};       // { profile: true/false, … }
let tagPickerOpen = false;
const collOpen = { stage: true, checklist: true };

// ── storage ────────────────────────────────────────────────────────────────────
function loadData()  { try { return JSON.parse(localStorage.getItem('stockTracker')||'[]'); } catch { return []; } }
function saveData(d) { localStorage.setItem('stockTracker', JSON.stringify(d)); }
function migrateStock(s) {
  if (!s.sections) { s.sections = EMPTY_SECS(); if (s.notes) { s.sections.profile = s.notes; delete s.notes; } }
  if (!s.tags) s.tags = [];
  if (!s.nextCatalyst) s.nextCatalyst = '';
  return s;
}

// ── seeds ──────────────────────────────────────────────────────────────────────
const SEEDS = [
  {
    id: 'urgn_seed', ticker: 'URGN', name: 'UroGen Pharma', stage: 'commercial',
    tags: ['platform_play','revenue_base','binary_event','derisked'],
    nextCatalyst: '[H2 2026] UGN-103 NDA submission → 12-month FDA review begins → PDUFA ~2027',
    attrs: [
      { id:'u1', label:'JELMYTO FDA-approved (2020) — LG-UTUC, ~$97-101M revenue guide 2026', checked:true  },
      { id:'u2', label:'ZUSDURI FDA-approved (Jun 2025) — LG-IR-NMIBC bladder cancer',        checked:true  },
      { id:'u3', label:'J-Code J9282 secured for ZUSDURI — effective Jan 1, 2026',             checked:true  },
      { id:'u4', label:'RTGel® proprietary platform — expandable to multiple indications',      checked:true  },
      { id:'u5', label:'Revenue growing 21% YoY (full year 2025)',                             checked:true  },
      { id:'u6', label:'First-in-class / only non-surgical chemoablative tx in its niches',    checked:true  },
      { id:'u7', label:'UGN-103 Phase 3 (UTOPIA) 77.8% CR — FDA agreed on NDA strategy',      checked:true  },
      { id:'u8', label:'UGN-103 NDA submitted (planned H2 2026)',                              checked:false },
      { id:'u9', label:'UGN-103 FDA approval received (expected 2027)',                        checked:false },
      { id:'u10',label:'UGN-104 Phase 3 enrollment completed (target end-2026)',               checked:false },
      { id:'u11',label:'UGN-501 IND filed + Phase 1 initiated (planned 2026)',                 checked:false },
      { id:'u12',label:'Path to profitability / opex sustainably below revenue',               checked:false },
    ],
    sections: {
      profile:
`COMPANY:   UroGen Pharma Ltd (Nasdaq: URGN)
FOCUS:     Uro-oncology — bladder & urinary tract cancers
PLATFORM:  RTGel® Reverse Thermal Gel — proprietary sustained-release delivery
           (not a single-drug company — technology is the moat)
STATUS:    Commercial-stage with 2 FDA-approved products + active pipeline`,

      products:
`━━ APPROVED / COMMERCIAL ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
1. JELMYTO (mitomycin) — Approved Apr 2020
   Indication : Low-grade upper tract urothelial cancer (LG-UTUC)
   Revenue    : $97–101M 2026 guide | Median durability 28.9 months
   Status     : First-in-class non-surgical chemoablative tx — established

2. ZUSDURI (UGN-102) — Approved Jun 2025
   Indication : LG intermediate-risk NMIBC (bladder cancer)
   J-Code     : J9282 effective Jan 1, 2026 → buy-and-bill now active
   Revenue    : $15.8M launch year (2025) — ramping in 2026

━━ PIPELINE ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
3. UGN-103  — NDA-ready (Phase 3 complete)
   Next-gen mitomycin | Simplified reconstitution vs ZUSDURI
   UTOPIA trial: 77.8% 3-month CR rate | FDA agreed on NDA path
   NDA planned H2 2026 → PDUFA ~mid-2027

4. UGN-104  — Phase 3 ongoing
   Indication : LG upper tract (JELMYTO label expansion)
   Enrollment target: end 2026

5. UGN-501  — IND-stage
   Oncolytic virus | High-risk NMIBC
   IND + Phase 1 planned 2026`,

      catalysts:
`[Q2/Q3 2026]  Type C FDA meetings — ZUSDURI label expansion (high-grade NMIBC + adjuvant)
[H2 2026]     UGN-103 NDA submission ← PRIMARY BINARY EVENT
[H2 2026]     UTOPIA full data publication / conference presentation
[End 2026]    UGN-104 Phase 3 enrollment completion
[2026]        UGN-501 IND filing + Phase 1 initiation (oncolytic virus)
[Q1/Q2 2026]  ZUSDURI revenue ramp data — J-Code adoption proof points
[~Mid 2027]   UGN-103 PDUFA / FDA decision (~12mo from H2 2026 filing)`,

      thesis:
`Platform company with 2 commercial drugs + pipeline on same sales infrastructure.

SCORE: 9 / 12
✔ Two FDA-approved products already generating revenue
✔ J-Code secured → ZUSDURI adoption inflection underway
✔ UGN-103 Phase 3 success → NDA path cleared by FDA
✔ RTGel platform = optionality across multiple urology indications
✔ First-in-class in its niches (not head-to-head vs blockbuster)
✗ Not yet profitable (opex $240-250M, revenue still ramping)
✗ ZUSDURI adoption pace vs expectations is unproven at scale
✗ UGN-103 approval not guaranteed

CLASSIFICATION: Commercial-stage platform + binary pipeline catalyst (2027)
Lower risk than pure-pipeline biotechs. Revenue base limits downside.
Upside lever: UGN-103 approval adds 3rd product on existing infrastructure.`,

      risks:
`- Not profitable: opex $240-250M vs growing-but-ramping revenue
- ZUSDURI ramp uncertain — J-Code is necessary but not sufficient
- UGN-103 approval not guaranteed (FDA path agreed, not pre-approved)
- Competition from TURBT surgery (standard of care) — physician habit is sticky
- Dilution risk if cash burn continues beyond expected timeline
- ZUSDURI label limited to LG-IR-NMIBC until expansion trials read out`,
    },
    updatedAt: Date.now(),
  },

  {
    id: 'ocul_seed', ticker: 'OCUL', name: 'Ocular Therapeutix', stage: 'nda',
    tags: ['platform_play','near_approval','binary_event','revenue_base','competitive'],
    nextCatalyst: '[2026] AXPAXLI NDA submission → FDA 10-12 month review → PDUFA ~2027',
    attrs: [
      { id:'o1', label:'Phase 3 SOL-1 completed with positive topline data (Feb 2026)',      checked:true  },
      { id:'o2', label:'Superiority vs standard treatment (not just non-inferior)',           checked:true  },
      { id:'o3', label:'DEXTENZA FDA-approved — existing commercial revenue base',            checked:true  },

function seedAll() {
  let data = loadData();
  let changed = false;
  SEEDS.forEach(seed => {
    const key = seed.ticker === 'EDSA' ? 'seeded_edsa_v4' : 'seeded_' + seed.ticker.toLowerCase() + '_v3';
    if (localStorage.getItem(key)) return;
    const existing = data.find(s => s.ticker === seed.ticker);
    if (existing) {
      migrateStock(existing);
      changed = true;
    } else {
      data.unshift({ ...seed });
      changed = true;
    }
    localStorage.setItem(key, '1');
  });
  if (changed) saveData(data);
}

seedAll();

// migrate all
(function(){
  const d = loadData(); let ch = false;
  d.forEach(s => { const before = JSON.stringify(s); migrateStock(s); if (JSON.stringify(s)!==before) ch=true; });
  if (ch) saveData(d);
})();

stocks = loadData();

// ── helpers ────────────────────────────────────────────────────────────────────
const stageById = id => STAGES.find(s => s.id === id) || STAGES[0];
const tagById   = id => ALL_TAGS.find(t => t.id === id);
const genId     = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const esc       = s  => (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

// ── lifecycle ──────────────────────────────────────────────────────────────────
document.getElementById('addInput').addEventListener('keydown', e => { if (e.key==='Enter') addStock(); });

function addStock() {
  const inp = document.getElementById('addInput');
  const raw = inp.value.trim().toUpperCase();
  if (!raw) return;
  const existing = stocks.find(s => s.ticker === raw);
  if (existing) { selectStock(existing.id); inp.value=''; return; }
  const s = {
    id: genId(), ticker: raw, name: '', stage: 'watchlist',
    tags: [], nextCatalyst: '',
    sections: EMPTY_SECS(),
    attrs: DEFAULT_ATTRS.map(label => ({ id: genId(), label, checked: false })),
    updatedAt: Date.now(),
  };
  stocks.unshift(s);
  saveData(stocks);
  inp.value = '';
  renderAll();
  selectStock(s.id);
}

function deleteStock(id, e) {
  e.stopPropagation();
  if (!confirm('Remove this entry?')) return;
  stocks = stocks.filter(s => s.id !== id);
  if (selectedId === id) { selectedId = null; showEmpty(); }
  saveData(stocks);
  renderAll();
}

function selectStock(id) {
  selectedId = id;
  editMode = {};
  tagPickerOpen = false;
  renderList();
  renderDetail();
}

function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.fbtn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderList();
}

// ── render sidebar ─────────────────────────────────────────────────────────────
function renderAll() { renderFilterBar(); renderList(); document.getElementById('totalCount').textContent = stocks.length+' tracked'; }

function renderFilterBar() {
  const bar = document.getElementById('filterBar');
  const used = [...new Set(stocks.map(s => s.stage))];
  bar.innerHTML = `<button class="fbtn ${currentFilter==='all'?'active':''}" onclick="setFilter('all',this)">All</button>`;
  STAGES.filter(st => used.includes(st.id)).forEach(st =>
    bar.innerHTML += `<button class="fbtn ${currentFilter===st.id?'active':''}" onclick="setFilter('${st.id}',this)">${st.label}</button>`
  );
}

function renderList() {
  const list = document.getElementById('stockList');
  const vis = currentFilter==='all' ? stocks : stocks.filter(s => s.stage===currentFilter);
  list.innerHTML = '';
  vis.forEach(s => {
    const st = stageById(s.stage);
    const c  = s.attrs.filter(a => a.checked).length;
    const el = document.createElement('div');
    el.className = 's-item' + (s.id===selectedId?' active':'');
    el.onclick = () => selectStock(s.id);
    el.innerHTML = `
      <span class="s-ticker">${s.ticker}</span>
      <span class="s-pill ${st.cls}">${st.label}</span>
      <span class="s-chk">${c}/${s.attrs.length}</span>
      <button class="s-del" onclick="deleteStock('${s.id}',event)">✕</button>`;
    list.appendChild(el);
  });
}

function showEmpty() {
  document.getElementById('mainPanel').innerHTML =
    `<div class="empty-state"><div class="ei">📋</div><div>Select or add a stock to begin</div></div>`;
}

// ── render detail ──────────────────────────────────────────────────────────────
function renderDetail() {
  const s = stocks.find(x => x.id === selectedId);
  if (!s) { showEmpty(); return; }
  const stage = stageById(s.stage);

              onclick="removeTag('${s.id}','${tid}')" title="Click to remove">${t.label}</span>`;
  }).join('');

  const pickerOpts = ALL_TAGS.map(t => {

                onclick="document.getElementById('body-stage').classList.toggle('open');document.getElementById('arr-stage').classList.toggle('open')"
                title="Click to change stage">${stage.label} ▾</span>
        </div>
        <div class="tags-row" id="tagsRow">
          ${activeTags}
          <button class="btn-addtag" onclick="toggleTagPicker()">+ Tag</button>
        </div>
        ${tagPickerOpen ? `<div class="tag-picker">${pickerOpts}</div>` : ''}
        <div class="cat-banner">
          <span class="cat-lbl">🚀 Next Catalyst</span>
          <span class="cat-sep">|</span>
          <input class="cat-input" id="catInput" placeholder="[Q/Year] Event — detail…"

        </div>
      </div>

      <!-- note sections 2-col grid -->
      <div class="sec-grid">
        ${secHTML('profile')}
        ${secHTML('products')}
        ${secHTML('catalysts', true)}
        ${secHTML('thesis')}
        ${secHTML('risks')}
      </div>

      <!-- stage -->
      <div class="coll-card">
        <div class="coll-hdr" onclick="toggleColl('stage')">

            ${STAGES.map(st=>`<div class="stage-chip ${st.cls}${s.stage===st.id?' selected':''}"

function toggleEdit(stockId, key) {
  editMode[key] = !editMode[key];
  renderDetail();
  if (editMode[key]) {
    const ta = document.getElementById('ta-'+key);
    if (ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
  }
}

let secTimers = {};
function autosaveSec(stockId, key, val) {
  clearTimeout(secTimers[key]);
  secTimers[key] = setTimeout(() => {
    const s = stocks.find(x => x.id === stockId);
    if (!s) return;
    s.sections[key] = val;
    s.updatedAt = Date.now();
    saveData(stocks);
    const meta = document.getElementById('meta-'+key);
    if (meta) meta.textContent = 'saved';
  }, 500);
}

// ── tags ───────────────────────────────────────────────────────────────────────
function toggleTagPicker() {
  tagPickerOpen = !tagPickerOpen;
  renderDetail();
}

function toggleTag(stockId, tagId) {
  const s = stocks.find(x => x.id === stockId);
  if (!s) return;
  const idx = (s.tags||[]).indexOf(tagId);
  if (idx === -1) s.tags.push(tagId); else s.tags.splice(idx, 1);
  saveData(stocks);
  renderDetail();
}

function removeTag(stockId, tagId) {
  const s = stocks.find(x => x.id === stockId);
  if (!s) return;
  s.tags = (s.tags||[]).filter(t => t !== tagId);
  saveData(stocks);
  renderDetail();
}

// ── inline saves ───────────────────────────────────────────────────────────────
function saveName(id, val) {
  const s = stocks.find(x => x.id === id); if (s) { s.name = val; saveData(stocks); }
}
function saveCatalyst(id, val) {
  const s = stocks.find(x => x.id === id); if (s) { s.nextCatalyst = val; saveData(stocks); }
}

// ── stage ──────────────────────────────────────────────────────────────────────
function setStage(id, stageId) {
  const s = stocks.find(x => x.id === id); if (!s) return;
  s.stage = stageId; s.updatedAt = Date.now();
  saveData(stocks); renderAll(); renderDetail();
}

// ── collapse ───────────────────────────────────────────────────────────────────
function toggleColl(key) {
  collOpen[key] = !collOpen[key];
  const body = document.getElementById('body-'+key);
  const arr  = document.getElementById('arr-'+key);
  if (body) body.classList.toggle('open', collOpen[key]);
  if (arr)  arr.classList.toggle('open', collOpen[key]);
}

// ── checklist ──────────────────────────────────────────────────────────────────
function toggleAttr(stockId, attrId, checked) {
  const s = stocks.find(x => x.id === stockId); if (!s) return;
  const a = s.attrs.find(x => x.id === attrId);
  if (a) { a.checked = checked; saveData(stocks); }
  const row = document.getElementById('ar-'+attrId);
  if (row) { row.classList.toggle('checked', checked); row.querySelector('.attr-lbl').classList.toggle('done', checked); }
  const c = s.attrs.filter(a => a.checked).length;
  const p = s.attrs.length ? Math.round(c/s.attrs.length*100) : 0;
  const badge = document.getElementById('chkBadge');
  const fill  = document.getElementById('progFill');
  if (badge) badge.textContent = `${c}/${s.attrs.length} · ${p}%`;
  if (fill)  fill.style.width = p+'%';
  renderList();
}

function addAttr(stockId) {
  const inp = document.getElementById('newAttr');
  const lbl = inp.value.trim(); if (!lbl) return;
  const s = stocks.find(x => x.id === stockId); if (!s) return;
  s.attrs.push({ id: genId(), label: lbl, checked: false });
  saveData(stocks); inp.value = ''; renderDetail();
}

function deleteAttr(stockId, attrId) {
  const s = stocks.find(x => x.id === stockId); if (!s) return;
  s.attrs = s.attrs.filter(a => a.id !== attrId);
  saveData(stocks); renderDetail();
}

// ── init ───────────────────────────────────────────────────────────────────────
renderAll();
if (stocks.length) selectStock(stocks[0].id);
</script>
</body>
</html>
